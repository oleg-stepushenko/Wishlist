<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --light: #dfe6e9;
            --dark: #2d3436;
            --success: #00b894;
            --danger: #d63031;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--dark);
            opacity: 0.7;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #b71c1c;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover {
            background: #009975;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--dark);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light);
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .wishlist-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .wishlist-item:hover {
            transform: translateY(-5px);
        }

        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .item-content {
            padding: 15px;
        }

        .item-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .item-description {
            margin-bottom: 10px;
            color: var(--dark);
            opacity: 0.8;
        }

        .item-purchase {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .purchase-option {
            background: var(--secondary);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .item-actions {
            display: flex;
            justify-content: space-between;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            font-size: 24px;
            cursor: pointer;
            color: var(--dark);
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            color: var(--dark);
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--primary);
            opacity: 1;
            border-bottom: 3px solid var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .wishlist-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .wishlist-card:hover {
            background: var(--secondary);
            color: white;
        }

        .wishlist-card.active {
            background: var(--primary);
            color: white;
        }

        .password-form {
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1001;
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.3s ease;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification.success {
            background: var(--success);
        }

        .notification.error {
            background: var(--danger);
        }

        @media (max-width: 768px) {
            .wishlist-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ My Wishlist ✨</h1>
            <p class="subtitle">Створюйте та керуйте своїми списками бажань</p>
        </header>

        <div class="tabs">
            <div class="tab active" data-tab="wishlists">Мої списки</div>
            <div class="tab" data-tab="create">Створити список</div>
        </div>

        <div class="tab-content active" id="wishlists-tab">
            <div class="card">
                <h2>Оберіть список</h2>
                <div id="wishlists-container"></div>
                <div class="password-form hidden" id="password-form">
                    <div class="form-group">
                        <label for="password">Пароль доступу:</label>
                        <input type="password" id="password" placeholder="Введіть пароль">
                    </div>
                    <button class="btn" id="access-btn">Отримати доступ</button>
                </div>
            </div>

            <div class="card hidden" id="current-wishlist">
                <div class="wishlist-header">
                    <h2 id="wishlist-title"></h2>
                    <button class="btn" id="add-item-btn">Додати пункт</button>
                </div>
                <div class="wishlist-grid" id="wishlist-items"></div>
            </div>
        </div>

        <div class="tab-content" id="create-tab">
            <div class="card">
                <h2>Створити новий список</h2>
                <div class="form-group">
                    <label for="new-wishlist-name">Назва списку:</label>
                    <input type="text" id="new-wishlist-name" placeholder="Наприклад: Подарунки на день народження">
                </div>
                <div class="form-group">
                    <label for="new-wishlist-password">Пароль для доступу:</label>
                    <input type="password" id="new-wishlist-password" placeholder="Встановіть пароль">
                </div>
                <button class="btn btn-success" id="create-wishlist-btn">Створити список</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно для додавання/редагування пункту -->
    <div class="modal" id="item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Додати новий пункт</h3>
                <span class="close">&times;</span>
            </div>
            <div class="form-group">
                <label for="item-name">Назва:</label>
                <input type="text" id="item-name" placeholder="Назва товару">
            </div>
            <div class="form-group">
                <label for="item-description">Опис:</label>
                <textarea id="item-description" rows="3" placeholder="Опишіть товар"></textarea>
            </div>
            <div class="form-group">
                <label for="item-purchase">Де купити (кожен варіант з нового рядка):</label>
                <textarea id="item-purchase" rows="3" placeholder="Наприклад:
Amazon
Rozetka
AliExpress"></textarea>
            </div>
            <div class="form-group">
                <label for="item-image">Зображення (URL):</label>
                <input type="text" id="item-image" placeholder="https://example.com/image.jpg">
            </div>
            <button class="btn btn-success" id="save-item-btn">Зберегти</button>
        </div>
    </div>

    <!-- Сповіщення -->
    <div class="notification" id="notification"></div>

    <script>
        // Firebase конфігурація
const firebaseConfig = {
  apiKey: "AIzaSyDk4rlTenGwipf4VoqEyQ9A-IwSF3R8PwA",
  authDomain: "my-wishlists-75b60.firebaseapp.com",
  projectId: "my-wishlists-75b60",
  storageBucket: "my-wishlists-75b60.firebasestorage.app",
  messagingSenderId: "532616779852",
  appId: "1:532616779852:web:e8d17793ba8364d9847ce9"
};

        // Ініціалізація Firebase (закоментуйте, якщо не використовуєте Firebase)
         firebase.initializeApp(firebaseConfig);
         const db = firebase.firestore();

        // Для прикладу використовуємо localStorage, але в продакшені замініть на Firebase
        let wishlists = {};
        let currentWishlistId = null;
        let currentEditingItemIndex = null;

        // DOM елементи
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const wishlistsContainer = document.getElementById('wishlists-container');
        const passwordForm = document.getElementById('password-form');
        const currentWishlist = document.getElementById('current-wishlist');
        const wishlistTitle = document.getElementById('wishlist-title');
        const wishlistItems = document.getElementById('wishlist-items');
        const addItemBtn = document.getElementById('add-item-btn');
        const itemModal = document.getElementById('item-modal');
        const closeModal = document.querySelector('.close');
        const saveItemBtn = document.getElementById('save-item-btn');
        const createWishlistBtn = document.getElementById('create-wishlist-btn');
        const accessBtn = document.getElementById('access-btn');
        const notification = document.getElementById('notification');

        // Обробники подій
        document.addEventListener('DOMContentLoaded', initApp);
        tabs.forEach(tab => tab.addEventListener('click', switchTab));
        addItemBtn.addEventListener('click', openAddItemModal);
        closeModal.addEventListener('click', closeItemModal);
        saveItemBtn.addEventListener('click', saveItem);
        createWishlistBtn.addEventListener('click', createWishlist);
        accessBtn.addEventListener('click', accessWishlist);

        // Функції
        function initApp() {
            renderWishlists();
        }

        function switchTab(e) {
            const tabId = e.target.getAttribute('data-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            e.target.classList.add('active');
            
            tabContents.forEach(content => {
                content.classList.remove('active');
                if (content.id === `${tabId}-tab`) {
                    content.classList.add('active');
                }
            });
        }

        function renderWishlists() {
            wishlistsContainer.innerHTML = '';
            
            if (Object.keys(wishlists).length === 0) {
                wishlistsContainer.innerHTML = '<p>У вас ще немає списків. Створіть перший!</p>';
                return;
            }
            
            for (const id in wishlists) {
                const wishlist = wishlists[id];
                const wishlistCard = document.createElement('div');
                wishlistCard.className = 'wishlist-card';
                wishlistCard.innerHTML = `
                    <span>${wishlist.name}</span>
                    <span>${wishlist.items ? wishlist.items.length : 0} пунктів</span>
                `;
                wishlistCard.addEventListener('click', () => selectWishlist(id));
                wishlistsContainer.appendChild(wishlistCard);
            }
        }

        function selectWishlist(id) {
            currentWishlistId = id;
            passwordForm.classList.remove('hidden');
            
            // Виділяємо обраний список
            document.querySelectorAll('.wishlist-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function accessWishlist() {
            const password = document.getElementById('password').value;
            const wishlist = wishlists[currentWishlistId];
            
            if (wishlist.password === password) {
                passwordForm.classList.add('hidden');
                currentWishlist.classList.remove('hidden');
                wishlistTitle.textContent = wishlist.name;
                renderWishlistItems();
                showNotification('Доступ надано!', 'success');
            } else {
                showNotification('Невірний пароль!', 'error');
            }
        }

        function renderWishlistItems() {
            wishlistItems.innerHTML = '';
            const wishlist = wishlists[currentWishlistId];
            
            if (!wishlist.items || wishlist.items.length === 0) {
                wishlistItems.innerHTML = '<p>Цей список поки що порожній. Додайте перший пункт!</p>';
                return;
            }
            
            wishlist.items.forEach((item, index) => {
                const itemElement = document.createElement('div');
                itemElement.className = 'wishlist-item';
                itemElement.innerHTML = `
                    ${item.image ? `<img src="${item.image}" alt="${item.name}" class="item-image">` : ''}
                    <div class="item-content">
                        <div class="item-title">${item.name}</div>
                        <div class="item-description">${item.description}</div>
                        <div class="item-purchase">
                            ${item.purchaseOptions ? item.purchaseOptions.map(option => 
                                `<span class="purchase-option">${option}</span>`
                            ).join('') : ''}
                        </div>
                        <div class="item-actions">
                            <button class="btn" onclick="editItem(${index})">Редагувати</button>
                            <button class="btn btn-danger" onclick="deleteItem(${index})">Видалити</button>
                        </div>
                    </div>
                `;
                wishlistItems.appendChild(itemElement);
            });
        }

        function openAddItemModal() {
            document.getElementById('modal-title').textContent = 'Додати новий пункт';
            document.getElementById('item-name').value = '';
            document.getElementById('item-description').value = '';
            document.getElementById('item-purchase').value = '';
            document.getElementById('item-image').value = '';
            itemModal.style.display = 'flex';
        }

        function closeItemModal() {
            itemModal.style.display = 'none';
        }

        function saveItem() {
            const name = document.getElementById('item-name').value;
            const description = document.getElementById('item-description').value;
            const purchase = document.getElementById('item-purchase').value;
            const image = document.getElementById('item-image').value;
            
            if (!name) {
                showNotification('Будь ласка, введіть назву пункту', 'error');
                return;
            }
            
            const purchaseOptions = purchase.split('\n').filter(option => option.trim() !== '');
            
            const newItem = {
                name,
                description,
                purchaseOptions,
                image
            };
            
            if (!wishlists[currentWishlistId].items) {
                wishlists[currentWishlistId].items = [];
            }
            
            wishlists[currentWishlistId].items.push(newItem);
            saveToStorage();
            renderWishlistItems();
            closeItemModal();
            showNotification('Пункт успішно додано!', 'success');
        }

        function editItem(index) {
            const item = wishlists[currentWishlistId].items[index];
            document.getElementById('modal-title').textContent = 'Редагувати пункт';
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-description').value = item.description;
            document.getElementById('item-purchase').value = item.purchaseOptions ? item.purchaseOptions.join('\n') : '';
            document.getElementById('item-image').value = item.image || '';
            
            // Змінюємо обробник події для збереження
            saveItemBtn.onclick = function() {
                updateItem(index);
            };
            
            itemModal.style.display = 'flex';
        }

        function updateItem(index) {
            const name = document.getElementById('item-name').value;
            const description = document.getElementById('item-description').value;
            const purchase = document.getElementById('item-purchase').value;
            const image = document.getElementById('item-image').value;
            
            if (!name) {
                showNotification('Будь ласка, введіть назву пункту', 'error');
                return;
            }
            
            const purchaseOptions = purchase.split('\n').filter(option => option.trim() !== '');
            
            wishlists[currentWishlistId].items[index] = {
                name,
                description,
                purchaseOptions,
                image
            };
            
            saveToStorage();
            renderWishlistItems();
            closeItemModal();
            
            // Повертаємо оригінальний обробник
            saveItemBtn.onclick = saveItem;
            
            showNotification('Пункт успішно оновлено!', 'success');
        }

        function deleteItem(index) {
            if (confirm('Ви впевнені, що хочете видалити цей пункт?')) {
                wishlists[currentWishlistId].items.splice(index, 1);
                saveToStorage();
                renderWishlistItems();
                showNotification('Пункт успішно видалено!', 'success');
            }
        }

        function createWishlist() {
            const name = document.getElementById('new-wishlist-name').value;
            const password = document.getElementById('new-wishlist-password').value;
            
            if (!name || !password) {
                showNotification('Будь ласка, заповніть всі поля', 'error');
                return;
            }
            
            const id = 'wishlist_' + Date.now();
            wishlists[id] = {
                name,
                password,
                items: []
            };
            
            saveToStorage();
            renderWishlists();
            
            document.getElementById('new-wishlist-name').value = '';
            document.getElementById('new-wishlist-password').value = '';
            
            showNotification('Список успішно створено!', 'success');
            
            // Перемикаємо на вкладку зі списками
            tabs[0].click();
        }

        function saveToStorage() {
            localStorage.setItem('wishlists', JSON.stringify(wishlists));
            
            // У продакшені замініть на збереження в Firebase
            // for (const id in wishlists) {
            //     db.collection('wishlists').doc(id).set(wishlists[id]);
            // }
        }

        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Закриття модального вікна при кліку поза ним
        window.addEventListener('click', (e) => {
            if (e.target === itemModal) {
                closeItemModal();
            }
        });
    </script>
</body>
</html>
